<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">Coach Carter Academy Arc warmup design flats</title>
  <desc id="desc">Front and back drawings of the maroon and bone curved-panel jacket and ink tearaway trousers.</desc>
  <defs>
    <path id="jacket" d="M127 133 188 108 211 116h36l23-8 61 25 43 112-35 13-35-63v103H154V195l-35 63-35-13z"/>
    <path id="pants" d="M160 325h138l13 163-60 2-22-102-22 102-60-2z"/>
    <clipPath id="body"><path d="M154 122 188 108 211 116h36l23-8 34 14v176H154z"/></clipPath>
    <g id="placket" fill="#d3b264"><circle cy="150" r="2.3"/><circle cy="177" r="2.3"/><circle cy="204" r="2.3"/><circle cy="231" r="2.3"/><circle cy="258" r="2.3"/><circle cy="285" r="2.3"/></g>
    <g id="legSnaps" fill="#5e1a2c"><circle cy="357" r="2"/><circle cy="378" r="2"/><circle cy="399" r="2"/><circle cy="420" r="2"/><circle cy="441" r="2"/><circle cy="462" r="2"/><circle cy="481" r="2"/></g>
  </defs>
  <rect width="1080" height="600" fill="#efe6d6"/>
  <g fill="#0b0806" font-family="sans-serif">
    <text x="62" y="52" font-size="13" font-weight="700" letter-spacing="3">COACH CARTER ACADEMY</text>
    <text x="62" y="83" font-size="26">Arc warmup / design flats</text>
    <text x="62" y="547" font-size="12" letter-spacing="2">FRONT</text>
    <text x="391" y="547" font-size="12" letter-spacing="2">BACK</text>
    <text x="731" y="151" font-size="13" font-weight="700">01 / ARC JACKET</text>
    <text x="731" y="177" font-size="12">Matte maroon woven shell with snap placket.</text>
    <text x="731" y="196" font-size="12">Bone panel from wearer’s right shoulder to left hip.</text>
    <text x="731" y="215" font-size="12">Align the panel across the placket when closed.</text>
    <text x="731" y="234" font-size="12">Ink below the arc at wearer’s left. Solid maroon back.</text>
    <text x="731" y="329" font-size="13" font-weight="700">02 / TEARAWAY TROUSER</text>
    <text x="731" y="355" font-size="12">Wide straight leg with narrow bone side tape.</text>
    <text x="731" y="374" font-size="12">Set dark snaps into the tape. Test over court shoes.</text>
    <text x="731" y="427" font-size="12" font-weight="700">EDITABLE CONCEPT / FIT AND PATTERN TBD</text>
  </g>
  <g stroke="#0b0806" stroke-width="1.6" stroke-linejoin="round">
    <use href="#jacket" fill="#5e1a2c"/>
    <g clip-path="url(#body)" stroke="none">
      <path d="M224 205Q258 230 310 243v55H224z" fill="#0b0806"/>
      <path d="M144 123h35q12 60 55 82 37 19 81 32l-5 18q-57-15-88-33-55-31-78-99" fill="#efe6d6"/>
    </g>
    <path d="M191 112 211 116h36l21-4-14 27-25-9-24 9z" fill="#5e1a2c"/>
    <path d="M229 130v168 M154 286h150 M94 236l29 13 M335 249l29-13" fill="none"/>
    <use href="#pants" fill="#0b0806"/>
    <path d="m160 327-12 156 10 1 13-157zm138 0 12 156-10 1-13-157z" fill="#efe6d6" stroke="none"/>
    <path d="M160 342h138 M229 342v47 M175 351l-4 28 M283 351l4 28" stroke="#66605a" fill="none"/>
    <g transform="translate(330)">
      <use href="#jacket" fill="#5e1a2c"/>
      <path d="M190 111 211 116h36l21-5-14 20h-50z M154 286h150 M94 236l29 13 M335 249l29-13" fill="#5e1a2c"/>
      <use href="#pants" fill="#0b0806"/>
      <path d="m160 327-12 156 10 1 13-157zm138 0 12 156-10 1-13-157z" fill="#efe6d6" stroke="none"/>
      <path d="M160 342h138 M229 342v47 M260 354h22" stroke="#66605a" fill="none"/>
    </g>
  </g>
  <use href="#placket" transform="translate(229)"/>
  <use href="#legSnaps" transform="matrix(1 0 -.077 1 189 0)"/>
  <use href="#legSnaps" transform="matrix(1 0 .077 1 268 0)"/>
