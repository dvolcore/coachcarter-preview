<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Court Collection — Coach Carter Academy</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/academy-store.css">
  <script defer src="assets/js/academy-product.js"></script>
</head>
<body class="academy-product-page">
  <header>
    <div class="store-shell">
      <a href="store.html"><img src="academy-studio/artwork/academy_wordmark_descriptor.svg" alt="Coach Carter Academy"></a>
      <a href="store.html#academy-store-title">← Court Collection</a>
    </div>
  </header>
  <main class="store-shell">
    <p id="product-error" role="status">Loading the collection. <a href="store.html#academy-store-title">Back to the collection</a></p>
    <article class="academy-product-layout" hidden>
      <div>
      <figure class="product-visual">
        <img id="product-image" width="900" height="1350" alt="">
        <figcaption>Front view · AI garment rendering</figcaption>
      </figure>
      <figure class="product-visual product-flat">
        <img id="product-flat" width="700" height="520" alt="Front and back garment design board" loading="lazy">
        <figcaption><a class="store-text-link" id="product-flat-download" download>Download the design board ↓</a></figcaption>
      </figure>
      </div>
      <div class="product-info">
        <p class="store-label">Coach Carter Academy · Collection 01</p>
        <h1 id="product-name"></h1>
        <p id="product-kind"></p>
        <p id="product-price" class="proposed"></p>
        <p class="product-note">Collection preview. Final fit and materials will be confirmed after sampling.</p>
        <h2>Design details</h2>
        <ul id="product-specs"></ul>
        <figure class="product-artwork">
          <img id="product-artwork" alt="" width="500" height="160" loading="lazy">
          <figcaption id="product-artwork-label"></figcaption>
        </figure>
        <a class="store-text-link" id="product-companion">Complete the look</a>
        <a class="store-text-link" href="academy-studio/index.html">Explore the Academy design library ↗</a>
      </div>
    </article>
  </main>
</body>
</html>
